{%- comment -%} 라이트/다크 전환 버튼. 위쪽 막대(휴대폰)와 사이드바 아래(데스크톱)에서 같이 쓴다. {%- endcomment -%}
<!-- 라이트/다크 전환 버튼: 사이드바 하단의 테마 메뉴 항목을 그대로 눌러 준다 -->
<button
  type="button"
  id="{{ include.id }}"
  class="btn btn-link mode-btn"
  aria-label="라이트/다크 전환"
  title="라이트/다크 전환"
  onclick="var m=document.documentElement.getAttribute('data-bs-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.querySelector('.sidebar-bottom .dropdown-item[data-theme-mode='+(m==='dark'?'light':'dark')+']').click();"
>
  <!-- 다크일 땐 해(라이트로), 라이트일 땐 달(다크로). 어느 쪽을 보일지는 CSS가 정한다 -->
  <svg class="mode-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.5"/>
    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
  </svg>
  <svg class="mode-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
  </svg>
</button>
