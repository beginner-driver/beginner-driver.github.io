<!-- 한글 웹 글꼴: Pretendard (필요한 글자만 내려받는 dynamic subset) -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
>

<!-- 화면보다 넓은 표 위에 "옆으로 밀어 보기" 안내 -->
<!-- ponytail: 처음 불러올 때만 판단함. 화면 회전 후에는 갱신되지 않음 -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.content .table-wrapper').forEach((w) => {
      if (w.scrollWidth > w.clientWidth + 2) {
        const hint = document.createElement('div');
        hint.className = 'table-scroll-hint';
        hint.textContent = '← 표를 옆으로 밀어 보세요 →';
        w.before(hint);
      }
    });
  });
</script>
